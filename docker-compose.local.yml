name: cognimoss-local

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: Dockerfile.backend
  env_file:
    - .env.local
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    local-init:
      condition: service_completed_successfully
    ollama-check:
      condition: service_completed_successfully
  volumes:
    - cognimoss-agent-runtime:/var/lib/agent-runner
    - cognimoss-indexer-runtime:/var/lib/cognee-indexer
    - cognimoss-debug-runtime:/var/lib/debug-runner
  restart: unless-stopped

services:
  moto:
    image: motoserver/moto:5.1.20
    environment:
      MOTO_PORT: "5000"
      S3_IGNORE_SUBDOMAIN_BUCKETNAME: "true"
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/moto-api/').read()"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  local-init:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file:
      - .env.local
    command: ["python", "/scripts/init_local_aws.py"]
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      moto:
        condition: service_healthy
    restart: "no"

  ollama-check:
    image: curlimages/curl:8.12.1
    env_file:
      - .env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      i=0
      until tags="$$(curl -fsS "$${OLLAMA_URL}/api/tags")"; do
        i=$$((i+1))
        if [ "$$i" -ge 30 ]; then
          echo "Ollama is not reachable from Docker at $${OLLAMA_URL}" >&2
          exit 1
        fi
        sleep 2
      done
      echo "$$tags" | grep -F "\"name\":\"$${OLLAMA_MODEL}\"" >/dev/null || {
        echo "Missing Ollama model: $${OLLAMA_MODEL}" >&2
        exit 1
      }
      echo "$$tags" | grep -F "\"name\":\"$${EMBEDDING_MODEL}\"" >/dev/null || {
        echo "Missing Ollama embedding model: $${EMBEDDING_MODEL}" >&2
        exit 1
      }
      echo "Ollama and required models are reachable."
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file:
      - .env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      local-init:
        condition: service_completed_successfully
      ollama-check:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  agent-worker:
    <<: *backend-common
    command: ["python", "worker.py"]

  cognee-indexer:
    <<: *backend-common
    command: ["python", "cognee_indexer.py"]

  debug-worker:
    <<: *backend-common
    command: ["python", "debug_worker.py"]

volumes:
  cognimoss-agent-runtime:
  cognimoss-indexer-runtime:
  cognimoss-debug-runtime:
